<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LitchiTec Site</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fdf2f8, #eff6ff);
      color: #1f2937;
    }

    main {
      width: min(90vw, 720px);
      padding: 3rem 2rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    p {
      margin: 0.75rem 0;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">GitHub Pages Sample</div>
    <h1>LitchiTec Site</h1>
    <p>このページは GitHub Pages 公開確認用のサンプルです。</p>
    <p>main ブランチにマージされると、GitHub Actions から自動でデプロイされます。</p>
  </main>
</body>
</html>
